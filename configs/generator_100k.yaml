seed: 42

# Dataset size and proportions (Elliptic: 203769 tx, ~23% labeled, ~10% illicit among labeled).
# labeled_ratio is a budget: schemes may fall below it, never above.
n_txs: 100000
labeled_ratio: 0.23
illicit_ratio_in_labeled: 0.10

# Feature engine (see generator.yaml for mode docs). Reference 100k dataset keeps cdf mode.
features:
  mode: cdf

stats_dir: data/elliptic_stats        # empirical CDF artifacts from the real Elliptic
out_dir: data/synthetic/run_100k      # output directory (4 CSV + manifest.json)

# Scheme parameters: instances per type and size ranges.
schemes:
  mixer:
    n_instances: 20
    fan_in_range: [5, 25]
    fan_out_range: [5, 25]
  peel_chain:
    n_instances: 25
    length_range: [4, 10]
  fanout:
    n_instances: 30
    victims_range: [5, 40]
  hub_spoke:
    n_instances: 10
    spokes_range: [10, 40]
  wash:
    n_instances: 10               # novel-scheme for drift; drives the RNG stream, keep stable
    cycle_len_range: [4, 8]

  # Opt-in modern/licit schemes must stay at n_instances: 0 to preserve the reference
  # structural stream (see generator.yaml for full parameter ranges).
  structuring: { n_instances: 0, deposits_range: [5, 30] }
  cycle_round_trip: { n_instances: 0, hops_range: [3, 6] }
  bridge_hopping: { n_instances: 0, bridges_range: [1, 3] }
  amm_swap_chain: { n_instances: 0, swaps_range: [2, 5] }
  exchange_hub: { n_instances: 0, clients_range: [20, 60] }
  miner_payout: { n_instances: 0, payouts_range: [10, 40] }
  wallet_provider: { n_instances: 0, addresses_range: [10, 50] }
  stealth_use: { n_instances: 0, stealth_range: [5, 30] }
  lending_laundry: { n_instances: 0, rounds_range: [1, 3] }

# p2p background: random directed edges between ordinary txs (no connectivity guarantee).
p2p_edges_per_tx: 1.5

# Optional temporal drift (mirrors the DarkMarket closure in the real Elliptic).
drift:
  enabled: false
  shutdown_step: 40                  # no non-novel illicit at steps >= shutdown_step
  shutdown_rate_multiplier: 0.0      # fraction of late illicit schemes that survive the shutdown
  novel_step: 45                     # novel schemes first appear at this step
  novel_schemes: [wash]              # schemes set aside to appear only in late steps
  scenario: null                     # optional label, e.g. multi_novel / gradual_decay

# Edge-level attributes (new CSV elliptic_txs_edge_attributes.csv). RNG for amounts
# comes from a separate derived stream — the structural stream (and hence the AC
# numbers 10000/14092/5856:2050:2094) is untouched.
edge_attributes:
  amount:
    mixer:      { fee_fraction: [0.005, 0.02], amount_per_in: [10000, 100000] }
    # Guard: keep start_amount >= ~5 (units); the drip chain floors at 1 and stops
    # strictly decreasing there (series then tails flat at 1 cent).
    peel_chain: { start_amount: [5000, 50000], drip: [0.50, 0.75] }
    wash:       { amount: [1000, 20000], balance_tolerance: 0.05 }
    hub_spoke:  { amount: [50, 5000] }
    fanout:     { amount: [50, 5000] }
    stealth_use: { amount: [500, 20000] }
    lending_laundry: { amount: [2000, 50000], margin_fraction: [0.10, 0.30] }
    p2p:        { amount: [1, 1000] }
  timestamp_scale: 1200              # seconds: 1200 * (max(step_u, step_v) - 1)

# Anchor-based retrieval bench: roots of instances become query anchors.
anchors:
  per_1000_nodes: 2                  # target anchor density
  min_anchor_distance: 3             # greedy isolation >= this (hops)
  prefer_central_anchors: true       # representative (min-eccentricity) queries per instance
  entity_types:
    mixer: wallet_mixer
    peel_chain: tumbler
    fanout: scam_propagator
    hub_spoke: exchange_hub
    wash: self_cycle
    structuring: structuring_agent
    cycle_round_trip: round_tripper
    bridge_hopping: bridge_hopping_user
    amm_swap_chain: amm_chain_trader
    exchange_hub: exchange
    miner_payout: miner
    wallet_provider: wallet_provider
    stealth_use: stealth_address_operator
    lending_laundry: debtor
  k_hop_range: [1, 3]                # neighborhood hop lists recorded in the manifest

# Background "search noise": detect accidental fan-in / cycle motifs in p2p edges.
background:
  decoy_detection: true
  fan_in_threshold: 3
  cycle_max_depth: 4

# Pattern-level holdout: tag instances whose temporal window overlaps an entry.
# Pure annotation (no graph mutation) — `drift` still controls wash emission.
holdout:
  entries: []                        # {pattern, step_min, step_max, train_excluded}
