data:
  raw_path: data/raw
  interim_path: data/interim
  processed_path: data/processed

features:
  n_base_features: 165
  n_behavioral_features: 26

models:
  lightgbm:
    n_estimators: 500
    learning_rate: 0.05
    class_weight: balanced
  autoencoder:
    latent_dim: 32
    epochs: 50
    batch_size: 64
  ensemble:
    meta_learner: logistic_regression

training:
  test_size: 0.2
  random_state: 42
  cv_folds: 5

api:
  host: 0.0.0.0
  port: 8000
