version: '3.8'
services:
  kyt-api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    environment:
      - KYT_ENV=production

  kyt-dashboard:
    build: .
    command: python -m kyt_engine.dashboard.app
    ports:
      - "8050:8050"
    volumes:
      - ./data:/app/data

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

volumes:
  minio-data:
