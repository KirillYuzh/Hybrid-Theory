apiVersion: v1
kind: Service
metadata:
  name: iceberg-service
  namespace: kyt-engine
  labels:
    app.kubernetes.io/name: kyt-engine
    app.kubernetes.io/component: iceberg
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kyt-engine
    app.kubernetes.io/component: iceberg
  ports:
    - name: rest
      port: 8181
      targetPort: 8181
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iceberg
  namespace: kyt-engine
  labels:
    app.kubernetes.io/name: kyt-engine
    app.kubernetes.io/component: iceberg
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kyt-engine
      app.kubernetes.io/component: iceberg
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kyt-engine
        app.kubernetes.io/component: iceberg
    spec:
      containers:
        - name: iceberg
          image: tabular/iceberg-rest:latest
          ports:
            - containerPort: 8181
              protocol: TCP
          env:
            - name: ICEBERG_CATALOG_TYPE
              value: "hadoop"
            - name: ICEBERG_CATALOG_WAREHOUSE
              value: "s3a://kyt-warehouse/"
            - name: ICEBERG_CATALOG_S3_ENDPOINT
              value: "http://minio-service:9000"
            - name: ICEBERG_CATALOG_S3_ACCESS_KEY
              valueFrom:
                configMapKeyRef:
                  name: kyt-config
                  key: MINIO_ACCESS_KEY
            - name: ICEBERG_CATALOG_S3_SECRET_KEY
              valueFrom:
                configMapKeyRef:
                  name: kyt-config
                  key: MINIO_SECRET_KEY
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /v1/config
              port: 8181
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/config
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3