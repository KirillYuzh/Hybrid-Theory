apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyt-api
  namespace: kyt-engine
  labels:
    app.kubernetes.io/name: kyt-engine
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kyt-engine
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kyt-engine
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: kyt-api
          image: kyt-engine:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: kyt-config
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: models-volume
              mountPath: /app/models
            - name: data-volume
              mountPath: /app/data
      volumes:
        - name: models-volume
          emptyDir: {}
        - name: data-volume
          emptyDir: {}
