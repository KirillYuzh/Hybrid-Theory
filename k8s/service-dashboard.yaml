apiVersion: v1
kind: Service
metadata:
  name: kyt-dashboard
  namespace: kyt-engine
  labels:
    app.kubernetes.io/name: kyt-engine
    app.kubernetes.io/component: dashboard
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kyt-engine
    app.kubernetes.io/component: dashboard
  ports:
    - name: http
      port: 8050
      targetPort: 8050
      protocol: TCP
      nodePort: 30081
