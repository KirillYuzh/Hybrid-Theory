apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: kyt-engine
  labels:
    app.kubernetes.io/name: kyt-engine
    app.kubernetes.io/component: minio
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kyt-engine
    app.kubernetes.io/component: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: console
      port: 9001
      targetPort: 9001
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: minio-console
  namespace: kyt-engine
  labels:
    app.kubernetes.io/name: kyt-engine
    app.kubernetes.io/component: minio
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kyt-engine
    app.kubernetes.io/component: minio
  ports:
    - name: console
      port: 9001
      targetPort: 9001
      protocol: TCP
      nodePort: 30090