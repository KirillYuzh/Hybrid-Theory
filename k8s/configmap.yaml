apiVersion: v1
kind: ConfigMap
metadata:
  name: kyt-config
  namespace: kyt-engine
  labels:
    app.kubernetes.io/name: kyt-engine
data:
  KYT_ENV: "production"
  KYT_MODEL_DIR: "/app/models"
  KYT_DATA_DIR: "/app/data"
  MINIO_ENDPOINT: "minio-service:9000"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin"
