[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kyt-engine"
version = "0.1.0"
description = "KYT Engine — движок для анализа и предсказания"
readme = "README.md"
license = "GNU Affero General Public License"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "lightgbm",
    "xgboost",
    "torch",
    "shap",
    "mlflow",
    "fastapi",
    "uvicorn",
    "feast",
    "networkx",
    "plotly",
    "streamlit",
    "dask",
    "pyarrow",
    "optuna",
    "node2vec",
    "pyiceberg",
    "duckdb",
    "duckdb-engine",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "jupyter",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kyt_engine"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/kyt_engine/models/*" = ["N803", "N806"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
